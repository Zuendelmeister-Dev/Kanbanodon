services:
  kanbanodon:
    build: .
    container_name: kanbanodon
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KANBANODON_ADDR: ":8080"
      KANBANODON_DATA_DIR: "/data"
      KANBANODON_AUTH_MODE: "local"
      KANBANODON_ALLOW_SIGNUP: "true"
      KANBANODON_SESSION_SECRET: "change-this-long-random-secret"
      # Independent startup actions. Disable after use, then recreate the container.
      KANBANODON_CLEAR_TASK_DATA: "${KANBANODON_CLEAR_TASK_DATA:-false}"
      KANBANODON_SEED_DEMO_DATA: "${KANBANODON_SEED_DEMO_DATA:-false}"
      # Compatibility: true performs both cleanup and a fresh demo seed.
      KANBANODON_RESET_DEMO_DATA: "${KANBANODON_RESET_DEMO_DATA:-false}"
    volumes:
      - kanbanodon-data:/data
    restart: unless-stopped

volumes:
  kanbanodon-data:
